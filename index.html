<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defeat CRIPONI</title>
    <link rel="stylesheet" type="text/css" href="./style.css">
</head>
<!--STOP SNOOPING AROUND THE METADATA YOU NERD also hello world :D-->
<body>
    <h1>DEFEAT ZEFFOUNI</h1>

<div id="game">
    <div id="boss-container">
        <img id="boss" src="unnamed.jpg" alt="The Final Boss">
    </div>
    <div id="boss-stats">

        <p id="health-text">HP: 1000/1000</p>

        <div id="health-bar">
            <div id="health"></div>
        </div>
    </div>

    <p id="player-health-text">YOUR HP: 100 / 100</p>

    <div id="player-health-bar">
        <div id="player-health"></div>
    </div>

    <div id="battle-message">
        what will you do?
    </div>

    <div id="buttons">
        <button id="attack-button">ATTACK</button>
        <button id="defend-button">DEFEND</button>
    </div>

</div>

<button id="lore-button">LORE</button>

<div id="lore-screen">
    <div id="lore-box">
        <button id="close-lore">X</button>

        <h2>THE LORE!</h2>

        <p>
            عندما هاجم الزفون كوكب الارض لم يستطع اي احد ايقافه
            فنهب الزفون الاراضي و طغى و اعتدى
        </p>
        
        <p>
            لكن ينتهي عصره الدكتاتوري اليوم &#128148;
        </p>

        <p>
            <strong>Threat level:</strong>98/100
        </p>

        <p>
            <strong>weakness: heiniken addiction</strong>
        </p>

        <p>
            <strong>special ability:</strong> slow motion punch
        </p>

    </div>
</div>

<audio id="hit-sound" src="hit-scream.mp3"></audio>
<audio id="defeat-sound" src="defeat-scream.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
